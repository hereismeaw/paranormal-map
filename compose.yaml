name: paranormal-map
x-build: &app-build
  context: .
  target: runner
  args:
    NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
    NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-/map-style.json}
    NEXT_PUBLIC_MAPTILER_API_KEY: ${NEXT_PUBLIC_MAPTILER_API_KEY:-}
services:
  app:
    build: *app-build
    env_file: ${ENV_FILE:-.env}
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
  migrate:
    build: { context: ., target: tools }
    command: ['npm', 'run', 'db:migrate']
    env_file: ${ENV_FILE:-.env}
    depends_on:
      postgres: { condition: service_healthy }
  media-worker:
    build: { context: ., target: tools }
    env_file: ${ENV_FILE:-.env}
    command: ['npm', 'run', 'media:worker']
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio: { condition: service_started }
    restart: unless-stopped
  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ['postgres-data:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  valkey:
    image: valkey/valkey:8.1.3-alpine
    command:
      [
        'valkey-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes: ['valkey-data:/data']
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes: ['evidence-data:/data']
    restart: unless-stopped
  clamav:
    image: clamav/clamav:1.4.3
    profiles: ['media-scanner']
    volumes: ['clamav-data:/var/lib/clamav']
    restart: unless-stopped
volumes:
  postgres-data:
  valkey-data:
  evidence-data:
  clamav-data:
