name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: paranormal
          POSTGRES_DB: paranormal
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U paranormal -d paranormal"
          --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:8.1.3-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgres://paranormal:ci-only-password@127.0.0.1:5432/paranormal
      REDIS_URL: redis://127.0.0.1:6379
      BETTER_AUTH_SECRET: ci-test-only-secret-never-for-a-real-deployment-00000
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      NEXT_TELEMETRY_DISABLED: 1
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: paranormal-evidence
      S3_FORCE_PATH_STYLE: 'true'
      S3_ACCESS_KEY_ID: ci-storage
      S3_SECRET_ACCESS_KEY: ci-only-storage-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Start private evidence storage for integration tests
        run: |
          docker run -d --name evidence-storage -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=ci-storage -e MINIO_ROOT_PASSWORD=ci-only-storage-password \
            ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9 server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
